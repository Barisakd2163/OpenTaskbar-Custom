name: Continuous Integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - redesign

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore OpenTaskbar.csproj

      - name: Build solution (Release, WarnAsError)
        run: dotnet build OpenTaskbar.csproj --configuration Release --warnaserror --no-restore --verbosity quiet

      - name: Run behavior and contract test suite
        run: dotnet run --project tests/OpenTaskbar.Tests/OpenTaskbar.Tests.csproj --configuration Release

      - name: Verify portable EXE starts without sidecar DLLs
        shell: pwsh
        run: |
          & "scripts/publish-portable.ps1" -Runtime win-x64 -OutputDir release
          & "scripts/check-portable.ps1" -OutputDir release -ExecutableName OpenTaskbar-x64.exe

      - name: Upload Windows preview build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: OpenTaskbar-redesign-preview
          path: release/
          if-no-files-found: error
          retention-days: 7
