name: Performance Baseline

# Requires an interactive Windows session (pointer moves, taskbar replacement,
# notepad windows). GitHub-hosted runners cannot do this reliably, so the job
# is manual-only and expects a self-hosted Windows x64 runner with dotnet-counters.
on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Output label (e.g. baseline, after-p0)'
        required: true
        type: string
      idle_seconds:
        description: 'Idle phase duration in seconds'
        required: false
        default: '12'
        type: string
      sweep_seconds:
        description: 'Pointer-sweep phase duration in seconds'
        required: false
        default: '12'
        type: string

permissions:
  contents: read

jobs:
  measure:
    name: Measure (interactive Windows)
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet-counters
        run: dotnet tool install --global dotnet-counters

      - name: Build (Release x64)
        run: dotnet build OpenTaskbar.csproj --configuration Release -p:Platform=x64

      - name: Measure baseline
        shell: pwsh
        run: |
          & "scripts/measure-baseline.ps1" `
            -Label "${{ inputs.label }}" `
            -IdleSeconds ${{ inputs.idle_seconds }} `
            -SweepSeconds ${{ inputs.sweep_seconds }}

      - name: Upload measurement
        uses: actions/upload-artifact@v7
        with:
          name: perf-${{ inputs.label }}
          path: artifacts/perf/${{ inputs.label }}/
          if-no-files-found: error
          retention-days: 30
