name: Pull Request Labeler

# pull_request_target will be blocked by default in public repos from 2026-12-02.
# The labeler never executes PR code (it only reads the changed-file list via the API),
# so the plain pull_request event is safe here and keeps working after that date.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    # Fork PRs receive a read-only GITHUB_TOKEN on pull_request events, so skip instead of failing with 403.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          sync-labels: true
