name: Feature Request
description: Suggest an idea, widget, or enhancement for OpenTaskbar
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please note that **all issue titles and descriptions must be written in English** so that the entire community and maintainers can participate.

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: A concise summary of the proposed feature or improvement.
      placeholder: Describe the feature you would like to see in OpenTaskbar...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Problem & Motivation
      description: Is your feature request related to a problem or limitation?
      placeholder: I'm always frustrated when [...] or Currently there is no way to [...]
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Observable Behavior
      description: Describe the solution you'd like and how it should look or behave.
      placeholder: Detailed description of the user experience and interface behavior...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
      placeholder: Describe any alternative approaches or workarounds...

  - type: textarea
    id: additional
    attributes:
      label: Additional Context / Mockups
      description: Add any other context, sketches, mockups, or references here.
