area/core:
  - changed-files:
      - any-glob-to-any-file:
          - '*.cs'
          - '*.xaml'
          - 'OpenTaskbar.csproj'

area/scripts:
  - changed-files:
      - any-glob-to-any-file:
          - 'scripts/**'

area/ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

area/docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'README.md'
          - 'LICENSE'
          - '.github/CONTRIBUTING.md'

area/tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**'
