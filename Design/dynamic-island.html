<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinamik Ada · OpenTaskbar</title>
<style>
  :root {
    color-scheme: light;
    font-family: "Segoe UI", sans-serif;
    --paper: #eef2f7;
    --ink: #20242c;
    --muted: #525c6a;
    --line: #d9e0e9;
    --surface: #f9fbfe;
    --blue: #005fb8;
    --panel: #10151e;
    --panel-raised: #1a2332;
    --white: #f6f8ff;
    --dim: #abb9cf;
    --accent: #a9d0ff;
    --motion: 220ms cubic-bezier(.23,1,.32,1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); }
  button, select, input { font: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  [hidden] { display: none !important; }
  main { width: min(1352px, 100%); margin: auto; padding: 0 clamp(16px, 4vw, 64px) 36px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 58px; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 600; font-size: .9rem; display: flex; align-items: center; gap: 9px; }
  .brand::before { content: ""; width: 17px; height: 14px; border: 2px solid var(--blue); border-radius: 4px; background: linear-gradient(var(--blue),var(--blue)) center 80% / 9px 2px no-repeat; }
  .tag, .hint { color: var(--muted); font-size: .86rem; }
  .intro { margin: 28px 0 24px; }
  h1 { margin: 0; font-size: clamp(1.85rem, 4vw, 2.7rem); line-height: 1.15; letter-spacing: -.035em; font-weight: 650; }
  .screens { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
  .monitor { min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .monitor-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 2px 12px; }
  h2 { font-size: .95rem; font-weight: 600; margin: 0; }
  .desktop {
    --island-shoulder: 12px;
    position: relative; min-height: 352px; padding: 0 calc(var(--island-shoulder) + 2px) 58px;
    border: 1px solid #263957; border-radius: 8px; isolation: isolate;
    background:
      radial-gradient(ellipse at 58% -14%, #111c3700 36%, #728ef078 49%, #223c9359 54%, transparent 70%),
      radial-gradient(ellipse at 116% 118%, #141940 17%, #364bb0 29%, #70a4ef 41%, #2c4f9c 48%, transparent 63%),
      linear-gradient(148deg, #1d2d53, #3f69a0 68%, #acc9ed);
  }
  .monitor:nth-child(2) .desktop {
    background:
      radial-gradient(ellipse at -15% 111%, #152b40 19%, #27677b 33%, #a2d8db 47%, #468eaa 52%, transparent 69%),
      radial-gradient(ellipse at 84% -35%, transparent 37%, #a5d8eb6b 50%, #427c9b3b 58%, transparent 70%),
      linear-gradient(150deg, #24394d, #39758d 68%, #a6cfd4);
  }
  .island {
    position: relative;
    width: min(268px, 100%); margin: 0 auto; color: var(--white); background: var(--panel);
    border-radius: 0 0 17px 17px;
    box-shadow: 0 12px 26px -9px #10191678;
    transition: width var(--motion), border-radius var(--motion); touch-action: pan-y;
  }
  .island::before, .island::after {
    content: ""; position: absolute; top: 0; pointer-events: none;
    width: var(--island-shoulder); height: var(--island-shoulder);
    background: radial-gradient(circle at left bottom, transparent calc(var(--island-shoulder) - 0.5px), var(--panel) var(--island-shoulder));
  }
  .island::before { right: 100%; }
  .island::after { left: 100%; scale: -1 1; }
  .island[data-open="true"] { width: min(100%, 396px); border-radius: 0 0 24px 24px; }
  .island :focus-visible { outline-color: var(--accent); outline-offset: -3px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 44px; padding: 6px 14px; border: 0; color: inherit; background: transparent; text-align: left; }
  .identity { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: .85rem; }
  .summary { flex: none; color: var(--dim); font-size: .78rem; font-variant-numeric: tabular-nums; margin-inline-start: auto; }
  .indicator { flex: none; width: 7px; height: 7px; margin: 0 2px 4px; border: solid var(--dim); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
  [data-open="true"] .indicator { transform: rotate(225deg); margin-block: 4px 0; }
  .expand { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--motion); }
  [data-open="true"] .expand { grid-template-rows: 1fr; }
  .expand-mask { overflow: hidden; min-height: 0; }
  .content { padding: 4px 14px 10px; }
  .page { min-height: 144px; border-radius: 12px; background: var(--panel-raised); padding: 14px; overflow-wrap: anywhere; }
  .clock, .timer, .progress-page { display: grid; align-content: center; gap: 6px; }
  .clock small, .timer small { color: var(--accent); font-weight: 600; }
  .clock time, .timer output, .progress-page output { color: var(--white); font-size: clamp(2.3rem, 6vw, 3.5rem); line-height: 1.05; font-weight: 600; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
  .date, .note { color: var(--dim); font-size: .82rem; }
  .note { margin: 8px 0 0; line-height: 1.4; }
  .readings { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 91px), 1fr)); gap: 6px; margin: 0; }
  .readings div { padding: 8px; border-radius: 6px; background: #ffffff08; min-width: 0; }
  .readings dt { color: var(--dim); font-size: .76rem; }
  .readings dd { margin: 5px 0 0; font-size: 1rem; font-variant-numeric: tabular-nums; }
  .rows { margin: 0; }
  .rows div { display: flex; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px solid #ffffff18; font-size: .84rem; }
  .rows dd { margin: 0; color: var(--dim); text-align: end; }
  .tiles, .timer-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tiles button, .timer button { min-height: 32px; border: 1px solid #ffffff26; border-radius: 6px; background: #ffffff0a; color: var(--white); padding: 4px 9px; font-size: .82rem; }
  .tiles button { flex: 1 1 auto; }
  .tiles button:disabled { cursor: default; color: var(--dim); }
  .timer [data-action="start"] { background: var(--accent); color: var(--panel); }
  .timer label { color: var(--dim); font-size: .82rem; }
  .timer input { width: 4.5em; color: var(--white); background: var(--panel); border: 1px solid #ffffff40; border-radius: 5px; padding: 3px 5px; }
  progress { width: 100%; height: 8px; accent-color: var(--accent); }
  .media { display: flex; flex-direction: column; justify-content: center; gap: 9px; }
  .media p { margin: 0; overflow-wrap: anywhere; }
  .file-label { align-self: start; font-size: .85rem; }
  input[type="file"] { width: 100%; max-width: 100%; font-size: .83rem; color: var(--dim); }
  input::file-selector-button { font: inherit; border: 0; border-radius: 7px; padding: 6px 9px; background: var(--accent); color: var(--ink); cursor: pointer; }
  audio { width: 100%; height: 36px; }
  .pages { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px; color: var(--dim); font-size: .76rem; font-variant-numeric: tabular-nums; }
  .page-step { width: 36px; min-height: 32px; border: 0; border-radius: 6px; background: none; color: var(--white); font-size: 1rem; }
  .page-step:hover, .timer button:hover { background-color: #ffffff1f; color: var(--white); }
  .dock { position: absolute; bottom: 9px; left: 50%; translate: -50% 0; display: flex; gap: 4px; align-items: center; max-width: calc(100% - 16px); overflow-x: auto; border: 1px solid #ffffff3b; border-radius: 8px; padding: 4px; background: #121925ec; color: var(--white); }
  .dock span { padding: 4px 7px; font-size: .75rem; white-space: nowrap; }
  .fields { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding-top: 12px; font-size: .8rem; }
  .fields label { display: grid; min-width: 0; gap: 4px; color: var(--muted); }
  select { width: 100%; min-width: 0; color: var(--ink); background: #fff; border: 1px solid #bac4d1; border-bottom-color: #8995a5; border-radius: 5px; padding: 6px; }
  .hint { line-height: 1.5; margin: 14px 0 0; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  @media (max-width: 720px) { .screens { grid-template-columns: 1fr; } .desktop { min-height: 328px; } }
  @media (prefers-reduced-motion: reduce) { .island, .expand { transition: none; } }
</style>
<main>
  <header><span class="brand">OpenTaskbar</span><span class="tag">Tasarım prototipi</span></header>
  <div class="intro">
    <h1>Dinamik Ada</h1>
  </div>
  <div class="screens"></div>
  <p class="hint">Açmak için adaya tıkla. Sayfa değiştirmek için kaydır veya sağ ve sol ok tuşlarını kullan.</p>
</main>
<template id="monitor">
  <section class="monitor">
    <div class="monitor-heading"><h2></h2><span class="tag"></span></div>
    <div class="desktop">
      <div class="island" data-open="false">
        <button class="toggle" type="button" aria-expanded="false">
          <span class="identity"></span><span class="summary" aria-hidden="true"></span><span class="indicator" aria-hidden="true"></span>
        </button>
        <div class="expand" inert>
          <div class="expand-mask">
            <div class="content">
              <section class="page clock" data-widget="Clock" aria-label="Tarih ve saat">
                <small>Yerel saat</small><time></time><span class="date"></span>
              </section>
              <section class="page media" data-widget="Media" aria-label="Medya kontrolü" hidden>
                <p class="track">Ses dosyası seçilmedi.</p>
                <label class="file-label">Yerel ses dosyası <input type="file" accept="audio/*"></label>
                <audio controls hidden></audio>
              </section>
              <nav class="pages" aria-label="Widget sayfaları">
                <button class="page-step" type="button" data-direction="-1" aria-label="Önceki widget">‹</button>
                <span class="page-index"></span>
                <button class="page-step" type="button" data-direction="1" aria-label="Sonraki widget">›</button>
              </nav>
            </div>
          </div>
        </div>
        <span class="visually-hidden announcement" role="status"></span>
      </div>
      <div class="dock" aria-label="Dock widget’ları" hidden></div>
    </div>
    <div class="fields">
      <label>Widget <select class="widget-picker"></select></label>
      <label>Konum <select class="position-picker"><option value="island">Ada</option><option value="dock">Dock</option></select></label>
    </div>
  </section>
</template>
<script>
  const widgets = [
    { group: 'Saat ve hava durumu', items: [
      { id: 'Clock', name: 'Tarih ve saat' },
      { id: 'Weather', name: 'Hava durumu', status: 'Şehir seçilmedi', tiles: ['Sıcaklık', 'Hissedilen', 'Nem'] },
      { id: 'DayProgress', name: 'Günün ilerlemesi' },
      { id: 'Stopwatch', name: 'Kronometre', timer: 'up' },
      { id: 'Countdown', name: 'Geri sayım', timer: 'down' }
    ] },
    { group: 'Sistem ve donanım', items: [
      { id: 'SystemStats', name: 'Sistem göstergeleri', tiles: ['CPU', 'RAM', 'GPU', 'CPU sıcaklığı', 'GPU sıcaklığı'] },
      { id: 'NetSpeed', name: 'İnternet hızı', tiles: ['↓ İndirme', '↑ Yükleme'] },
      { id: 'Battery', name: 'Pil', rows: ['Pil seviyesi', 'Şarj durumu'] },
      { id: 'BluetoothBattery', name: 'Kablosuz ve Bluetooth pilleri', short: 'Cihaz pilleri', rows: ['Bağlı cihazlar', 'Pil seviyesi'] },
      { id: 'Storage', name: 'Sistem diski', rows: ['Kullanılan alan', 'Boş alan', 'Toplam kapasite'] }
    ] },
    { group: 'Yapay zekâ kullanımı', items: [
      ['Claude', ['Oturum', 'Haftalık']],
      ['Codex', ['Oturum', 'Haftalık']],
      ['Antigravity', ['Oturum', 'Haftalık', 'Model kotaları']],
      ['OpenCode', ['Saatlik', 'Haftalık', 'Aylık']],
      ['Copilot', ['Aylık kullanım']],
      ['DeepSeek', ['Bakiye']],
      ['OpenRouter', ['Krediler']],
      ['Cursor', ['Oturum', 'Haftalık']]
    ].map(([name, rows]) => ({ id: 'AiUsage' + name, name, rows, status: 'Hesap bağlı değil' })) },
    { group: 'Medya ve kontroller', items: [
      { id: 'Media', name: 'Medya kontrolü' },
      { id: 'Audio', name: 'Ses cihazı ve düzeyi', short: 'Ses', rows: ['Çıkış cihazı', 'Giriş cihazı', 'Uygulama sesleri'] },
      { id: 'QuickSettings', name: 'Hızlı ayarlar', controls: ['Wi-Fi', 'Bluetooth', 'Gece ışığı'] }
    ] },
    { group: 'Verimlilik', items: [
      { id: 'Focus', name: 'Odak zamanlayıcısı', short: 'Odak', timer: 'down' }
    ] }
  ];
  const catalog = new Map(widgets.flatMap(({ items }) => items.map(widget => [widget.id, widget])));
  const percentFormat = new Intl.NumberFormat('tr-TR', { style: 'percent' });
  const timeFormat = new Intl.DateTimeFormat('tr-TR', { hour: '2-digit', minute: '2-digit' });
  const dateFormat = new Intl.DateTimeFormat('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' });
  const template = document.querySelector('#monitor');
  const screens = document.querySelector('.screens');

  function buildPage(widget) {
    const page = document.createElement('section');
    page.className = 'page';
    page.dataset.widget = widget.id;
    page.setAttribute('aria-label', widget.name);
    page.hidden = true;
    if (widget.id === 'DayProgress') {
      page.classList.add('progress-page');
      page.innerHTML = '<output></output><progress max="1" aria-label="Günün ilerlemesi"></progress><span class="date"></span>';
    } else if (widget.timer) {
      page.classList.add('timer');
      const minutes = widget.id === 'Focus' ? 25 : 5;
      page.innerHTML = '<output aria-live="off"></output><div class="timer-actions"></div>';
      const actions = page.querySelector('.timer-actions');
      if (widget.timer === 'down') {
        actions.innerHTML = '<label>Dakika <input type="number" min="1" max="180" step="1" required value="' + minutes + '"></label>';
      }
      actions.insertAdjacentHTML('beforeend', '<button type="button" data-action="start">Başlat</button><button type="button" data-action="reset">Sıfırla</button>');
    } else {
      if (widget.controls) {
        const tiles = document.createElement('div');
        tiles.className = 'tiles';
        for (const label of widget.controls) {
          const button = document.createElement('button');
          button.type = 'button';
          button.disabled = true;
          button.textContent = label;
          tiles.append(button);
        }
        page.append(tiles);
      } else {
        const list = document.createElement('dl');
        list.className = widget.tiles ? 'readings' : 'rows';
        for (const label of widget.tiles ?? widget.rows) {
          const row = document.createElement('div');
          const name = document.createElement('dt');
          const value = document.createElement('dd');
          name.textContent = label;
          value.textContent = '—';
          row.append(name, value);
          list.append(row);
        }
        page.append(list);
      }
      const note = document.createElement('p');
      note.className = 'note';
      note.textContent = widget.status ?? 'Windows verisi bu önizlemede kullanılamıyor.';
      page.append(note);
    }
    return page;
  }

  function connectTimer(page, direction) {
    const output = page.querySelector('output');
    const input = page.querySelector('input');
    const start = page.querySelector('[data-action="start"]');
    const limit = () => input ? input.valueAsNumber * 60 : 0;
    let base = limit();
    let startedAt = null;
    function tick() {
      const elapsed = startedAt === null ? 0 : (performance.now() - startedAt) / 1000;
      const seconds = direction === 'up' ? Math.floor(base + elapsed) : Math.max(0, Math.ceil(base - elapsed));
      if (direction === 'down' && seconds === 0 && startedAt !== null) {
        base = 0;
        startedAt = null;
        start.textContent = 'Başlat';
        input.disabled = false;
      }
      const value = [Math.floor(seconds / 60), seconds % 60].map(part => String(part).padStart(2, '0')).join(':');
      if (output.value !== value) output.value = value;
      return value;
    }
    function reset() {
      base = limit();
      startedAt = null;
      if (input) input.disabled = false;
      start.textContent = 'Başlat';
      tick();
    }
    input?.addEventListener('input', () => {
      start.disabled = !input.validity.valid;
      if (!start.disabled) reset();
    });
    start.addEventListener('click', () => {
      const now = performance.now();
      if (startedAt === null) {
        if (input && base <= 0) base = limit();
        startedAt = now;
        start.textContent = 'Duraklat';
      } else {
        const elapsed = (now - startedAt) / 1000;
        base = input ? Math.max(0, base - elapsed) : base + elapsed;
        startedAt = null;
        start.textContent = 'Devam et';
      }
      if (input) input.disabled = startedAt !== null;
      tick();
    });
    page.querySelector('[data-action="reset"]').addEventListener('click', () => {
      if (input && !input.validity.valid) input.reportValidity();
      else reset();
    });
    return tick;
  }
  function createMonitor(index, initialPage, expanded) {
    const monitor = template.content.firstElementChild.cloneNode(true);
    const island = monitor.querySelector('.island');
    const toggle = monitor.querySelector('.toggle');
    const expand = monitor.querySelector('.expand');
    const nav = monitor.querySelector('nav');
    const dock = monitor.querySelector('.dock');
    const identity = monitor.querySelector('.identity');
    const summary = monitor.querySelector('.summary');
    const time = monitor.querySelector('time');
    const date = monitor.querySelector('.date');
    const audio = monitor.querySelector('audio');
    const track = monitor.querySelector('.track');
    const picker = monitor.querySelector('.widget-picker');
    const placement = monitor.querySelector('.position-picker');
    const positions = new Map([...catalog.keys()].map(id => [id, 'island']));
    const timers = new Map();
    const pagesById = new Map([...monitor.querySelectorAll('.page')].map(page => [page.dataset.widget, page]));
    for (const { group, items } of widgets) {
      const options = document.createElement('optgroup');
      options.label = group;
      for (const widget of items) {
        options.append(new Option(widget.name, widget.id));
        if (pagesById.has(widget.id)) continue;
        const page = buildPage(widget);
        pagesById.set(widget.id, page);
        nav.before(page);
        if (widget.timer) timers.set(widget.id, connectTimer(page, widget.timer));
      }
      picker.append(options);
    }
    const day = pagesById.get('DayProgress');
    const dayMeter = day.querySelector('progress');
    const dayValue = day.querySelector('output');
    const dayRemaining = day.querySelector('.date');
    let selected = initialPage;
    let audioUrl;
    let gesture;
    let wheelTotal = 0;
    let lastWheel = -Infinity;
    let wheelConsumed = false;
    monitor.querySelector('h2').textContent = 'Ekran ' + index;
    monitor.querySelector('.monitor-heading .tag').textContent = index === 1 ? 'Ana ekran' : 'İkinci ekran';
    expand.id = 'island-content-' + index;
    toggle.setAttribute('aria-controls', expand.id);

    function setOpen(open) {
      if (!open && expand.contains(document.activeElement)) toggle.focus();
      island.dataset.open = String(open);
      toggle.setAttribute('aria-expanded', String(open));
      expand.inert = !open;
    }

    function islandPages() {
      return [...positions.keys()].filter(widget => positions.get(widget) === 'island');
    }

    function update() {
      const now = new Date();
      const localTime = timeFormat.format(now);
      time.textContent = localTime;
      time.dateTime = localTime;
      date.textContent = dateFormat.format(now);
      const minutes = now.getHours() * 60 + now.getMinutes();
      const dayPercent = percentFormat.format(minutes / 1440);
      dayMeter.value = minutes / 1440;
      if (dayValue.value !== dayPercent) dayValue.value = dayPercent;
      const remaining = 1440 - minutes;
      dayRemaining.textContent = Math.floor(remaining / 60) + ' sa. ' + remaining % 60 + ' dk. kaldı';
      let currentTimer;
      for (const [id, tick] of timers) {
        const value = tick();
        if (id === selected) currentTimer = value;
      }
      const compact = {
        Clock: localTime, DayProgress: dayPercent,
        Media: audio.error ? 'Oynatılamadı' : audio.paused ? (audioUrl ? 'Hazır' : 'Dosya seçilmedi') : 'Çalıyor',
        Weather: 'Şehir seçilmedi'
      };
      summary.textContent = currentTimer ?? compact[selected] ??
        (selected?.startsWith('AiUsage') ? 'Bağlı değil' : selected ? 'Veri yok' : '');
      const dockClock = dock.querySelector('[data-clock]');
      if (dockClock) dockClock.textContent = localTime;
    }

    function showPage(widget, announce = false, syncPicker = true) {
      selected = widget;
      const definition = catalog.get(widget);
      identity.textContent = definition?.short ?? definition?.name ?? '';
      if (definition) toggle.setAttribute('aria-label', definition.name + ' ayrıntıları');
      for (const [id, page] of pagesById) {
        if (id !== widget && page.contains(document.activeElement)) toggle.focus();
        page.hidden = id !== widget;
      }
      const pages = islandPages();
      nav.hidden = pages.length < 2;
      nav.querySelector('.page-index').textContent = (pages.indexOf(widget) + 1) + ' / ' + pages.length;
      island.hidden = !widget;
      if (syncPicker && widget) picker.value = widget;
      placement.value = positions.get(picker.value);
      if (announce && definition) monitor.querySelector('.announcement').textContent = definition.name + ' sayfası';
      update();
    }

    function movePage(direction) {
      const pages = islandPages();
      if (pages.length < 2) return;
      showPage(pages[(pages.indexOf(selected) + direction + pages.length) % pages.length], true);
    }

    toggle.addEventListener('click', () => setOpen(island.dataset.open !== 'true'));
    nav.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (button) movePage(Number(button.dataset.direction));
    });
    island.addEventListener('keydown', event => {
      if (event.target.closest('input, audio')) return;
      if (event.key === 'Escape') setOpen(false);
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
        movePage(event.key === 'ArrowRight' ? 1 : -1);
      }
    });
    island.addEventListener('wheel', event => {
      if (islandPages().length < 2 || event.ctrlKey || event.target.closest('input, audio')) return;
      const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
      if (!delta) return;
      event.preventDefault();
      if (event.timeStamp - lastWheel > 150) {
        wheelTotal = 0;
        wheelConsumed = false;
      }
      lastWheel = event.timeStamp;
      if (wheelConsumed) return;
      wheelTotal += delta * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? 100 : 1);
      if (Math.abs(wheelTotal) >= 24) {
        movePage(Math.sign(wheelTotal));
        wheelConsumed = true;
      }
    }, { passive: false });
    island.addEventListener('pointerdown', event => {
      if (event.pointerType !== 'touch' || event.target.closest('input, audio, button:not(.toggle)')) return;
      gesture = { id: event.pointerId, x: event.clientX, y: event.clientY };
    });
    island.addEventListener('pointerup', event => {
      if (!gesture || gesture.id !== event.pointerId) return;
      const { x, y } = gesture;
      gesture = undefined;
      const dx = event.clientX - x;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(event.clientY - y)) {
        event.preventDefault();
        movePage(dx < 0 ? 1 : -1);
        toggle.addEventListener('click', suppressSwipeClick, { capture: true, once: true });
        setTimeout(() => toggle.removeEventListener('click', suppressSwipeClick, true), 350);
      }
    });
    function suppressSwipeClick(event) { event.stopImmediatePropagation(); }
    island.addEventListener('pointercancel', () => { gesture = undefined; });

    picker.addEventListener('change', () => {
      placement.value = positions.get(picker.value);
      if (placement.value === 'island') showPage(picker.value, true);
    });
    placement.addEventListener('change', () => {
      const widget = picker.value;
      positions.set(widget, placement.value);
      const dockItems = [...positions].filter(([, position]) => position === 'dock');
      dock.replaceChildren(...dockItems.map(([id]) => {
        const item = document.createElement('span');
        const definition = catalog.get(id);
        item.textContent = definition.short ?? definition.name;
        if (id === 'Clock') item.dataset.clock = '';
        return item;
      }));
      dock.hidden = dockItems.length === 0;
      const pages = islandPages();
      const next = placement.value === 'island' ? widget : pages.includes(selected) ? selected : pages[0];
      showPage(next, false, false);
    });

    monitor.querySelector('.media input').addEventListener('change', event => {
      const file = event.target.files[0];
      if (!file) return;
      if (audioUrl) URL.revokeObjectURL(audioUrl);
      audioUrl = URL.createObjectURL(file);
      audio.src = audioUrl;
      track.textContent = file.name;
      audio.hidden = false;
      update();
    });
    for (const event of ['play', 'pause', 'ended']) audio.addEventListener(event, update);
    audio.addEventListener('error', () => {
      track.textContent = 'Bu ses dosyası oynatılamadı.';
      update();
    });
    setOpen(expanded);
    showPage(initialPage);
    screens.append(monitor);
    return update;
  }

  const monitors = [createMonitor(1, 'Clock', true), createMonitor(2, 'Media', false)];
  setInterval(() => monitors.forEach(update => update()), 250);
</script>
</html>
