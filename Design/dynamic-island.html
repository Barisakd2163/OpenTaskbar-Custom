<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinamik Ada · OpenTaskbar</title>
<style>
  :root {
    color-scheme: light;
    font-family: "Segoe UI", sans-serif;
    --paper: #eef2f7;
    --ink: #20242c;
    --muted: #525c6a;
    --line: #d9e0e9;
    --surface: #f9fbfe;
    --blue: #005fb8;
    --panel: #101217;
    --panel-raised: #181b22;
    --panel-line: #333843;
    --white: #fafafa;
    --dim: #b7b8c1;
    --accent: #c2d9ff;
    --island-compact-height: 50px;
    --island-open-height: 246px;
    --island-controls-height: 174px;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --motion: 220ms cubic-bezier(.23,1,.32,1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); }
  button, select, input { font: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  [hidden] { display: none !important; }
  main { width: min(1352px, 100%); margin: auto; padding: 0 clamp(16px, 4vw, 64px) 36px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 58px; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 600; font-size: .9rem; display: flex; align-items: center; gap: 9px; }
  .brand::before { content: ""; width: 17px; height: 14px; border: 2px solid var(--blue); border-radius: 4px; background: linear-gradient(var(--blue),var(--blue)) center 80% / 9px 2px no-repeat; }
  .tag, .hint { color: var(--muted); font-size: .86rem; }
  .intro { margin: 28px 0 24px; }
  h1 { margin: 0; font-size: clamp(1.85rem, 4vw, 2.7rem); line-height: 1.15; letter-spacing: -.035em; font-weight: 650; }
  .screens { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
  .monitor { min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: 0 2px 5px #233b5710; }
  .monitor-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 2px 12px; }
  h2 { font-size: .95rem; font-weight: 600; margin: 0; }
  .monitor-heading h2 { display: flex; align-items: center; gap: 7px; }
  .monitor-heading .icon { color: var(--blue); }
  .desktop {
    --island-shoulder: 12px;
    position: relative; min-height: 352px; padding: 0 calc(var(--island-shoulder) + 2px) 58px;
    border: 1px solid #263957; border-radius: 8px; isolation: isolate;
    background:
      radial-gradient(ellipse at 116% 119%, #172650 23%, #304f98 34%, #90b3fb 45%, #304e86 53%, transparent 72%),
      radial-gradient(ellipse at 11% 125%, #a2c1ed 0%, #366094 38%, transparent 68%),
      linear-gradient(142deg, #172941, #2e4b76 62%, #7199c7);
  }
  .monitor:nth-child(2) .desktop {
    background:
      radial-gradient(ellipse at -15% 114%, #142d46 19%, #2e6985 38%, #a4ced7 49%, #42849a 57%, transparent 76%),
      radial-gradient(ellipse at 100% 112%, #7caab6 0%, #325e75 48%, transparent 75%),
      linear-gradient(150deg, #24394d, #315176 68%, #7ea9bc);
  }
  .island {
    position: relative;
    display: flex; flex-direction: column;
    width: min(320px, 100%); height: var(--island-compact-height); max-height: var(--island-compact-height); margin: 0 auto; color: var(--white); background: var(--panel);
    --widget-accent: var(--accent);
    border-radius: 0 0 17px 17px;
    box-shadow: 0 16px 30px -10px #040811a6, inset 0 -1px #ffffff12;
    transition: width var(--motion), height var(--motion), border-radius var(--motion); touch-action: pan-y;
  }
  .island::before, .island::after {
    content: ""; position: absolute; top: 0; pointer-events: none;
    width: var(--island-shoulder); height: var(--island-shoulder);
    background: radial-gradient(circle at left bottom, transparent calc(var(--island-shoulder) - 0.5px), var(--panel) var(--island-shoulder));
  }
  .island::before { right: 100%; }
  .island::after { left: 100%; scale: -1 1; }
  .island[data-open="true"] { width: min(100%, 416px); height: var(--island-open-height); max-height: var(--island-open-height); border-radius: 0 0 22px 22px; }
  .island :focus-visible { outline-color: var(--accent); outline-offset: -3px; }
  .island-header { display: flex; align-items: center; flex: 0 0 var(--island-compact-height); min-width: 0; padding: 0 var(--space-2); gap: var(--space-1); }
  .toggle { display: flex; align-items: center; gap: var(--space-2); flex: 1; min-width: 0; height: 38px; padding: 0 var(--space-2); border: 0; border-radius: 8px; color: inherit; background: transparent; text-align: left; }
  .controls-button { display: grid; place-items: center; width: 32px; height: 32px; flex: none; padding: 0; border: 1px solid transparent; border-radius: 7px; color: var(--dim); background: none; }
  .controls-button::before { content: ""; width: 3px; height: 3px; border-radius: 50%; background: currentColor; box-shadow: 5px 0 currentColor, -5px 0 currentColor; }
  .controls-button[aria-expanded="true"] { color: var(--white); border-color: var(--panel-line); background: #ffffff10; }
  @media (hover: hover) { .toggle:hover, .controls-button:hover { background: #ffffff0e; } }
  .icon { flex: none; width: 15px; height: 15px; vertical-align: middle; }
  .widget-icon { display: grid; place-items: center; flex: 0 0 24px; height: 24px; color: var(--widget-accent); }
  .widget-icon .icon { width: 17px; height: 17px; }
  .identity { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: .83rem; }
  .summary { flex: 0 1 auto; min-width: 0; max-width: 58%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--widget-accent); font-size: .82rem; font-weight: 600; font-variant-numeric: tabular-nums; margin-inline-start: auto; }
  .island[data-widget="Clock"] .summary, .island[data-widget="Stopwatch"] .summary,
  .island[data-widget="Countdown"] .summary, .island[data-widget="Focus"] .summary { font-size: 1rem; }
  .indicator { flex: none; color: var(--dim); transition: transform var(--motion); }
  [data-open="true"] .indicator { transform: rotate(180deg); }
  .expand { display: flex; flex: 1; min-height: 0; }
  [data-open="false"] .expand {
    position: absolute; z-index: 2; inset: calc(100% + var(--space-2)) 0 auto;
    height: var(--island-controls-height); max-height: var(--island-controls-height);
    border: 1px solid var(--panel-line); border-radius: 12px;
    background: var(--panel); box-shadow: 0 12px 28px #080c1859;
  }
  .content { display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; padding: var(--space-2) var(--space-2) var(--space-1); }
  .page {
    flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: #686b77 transparent;
    border: 1px solid var(--panel-line); border-radius: 9px;
    background: var(--panel-raised); padding: var(--space-2); overflow-wrap: anywhere;
  }
  [data-open="true"] .content { padding: 0 var(--space-3) var(--space-2); }
  [data-open="true"] .page { padding: var(--space-3); }
  [data-open="true"] .controls-button { display: none; }
  .clock, .timer, .progress-page { display: grid; align-content: safe center; gap: 6px; }
  .clock small, .timer small { color: var(--widget-accent); font-weight: 600; }
  .clock time, .timer output, .progress-page output { color: var(--white); font-size: 1.85rem; line-height: 1.05; font-weight: 600; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
  [data-open="true"] :is(.clock time, .timer output, .progress-page output) { font-size: clamp(2.3rem, 6vw, 3.5rem); }
  .date, .note { color: var(--dim); font-size: .82rem; }
  .note { margin: 8px 0 0; line-height: 1.4; }
  .readings { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 65px), 1fr)); gap: 5px; margin: 0; }
  .readings div { padding: 5px 6px; border: 1px solid var(--panel-line); border-radius: 6px; min-width: 0; background: #0d0f152e; }
  .readings dt { color: var(--dim); font-size: .69rem; }
  .readings dd { margin: 3px 0 0; font-size: .88rem; font-weight: 550; font-variant-numeric: tabular-nums; }
  .page[data-widget="SystemStats"] .readings { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .page[data-widget="SystemStats"] .readings div { grid-column: span 2; border: 0; border-bottom: 1px solid var(--panel-line); border-radius: 0; background: transparent; }
  .page[data-widget="SystemStats"] .readings div:nth-child(n+4) { grid-column: span 3; }
  .page[data-widget="NetSpeed"] .readings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  [data-open="true"] .readings div { padding: 9px; }
  [data-open="true"] .readings dd { font-size: 1.15rem; }
  [data-open="true"] .page[data-widget="SystemStats"] .readings div { padding-block: 5px; }
  [data-open="true"] .page[data-widget="Weather"] .readings { grid-template-columns: 1.35fr 1fr; }
  [data-open="true"] .page[data-widget="Weather"] .readings div { padding-block: 5px; }
  [data-open="true"] .page[data-widget="Weather"] .readings div:not(:first-child) dd { font-size: .95rem; }
  [data-open="true"] .page[data-widget="Weather"] .readings div:first-child { grid-row: span 2; align-content: center; }
  [data-open="true"] .page[data-widget="Weather"] .readings div:first-child dd { font-size: clamp(1.8rem, 4vw, 2.7rem); color: var(--widget-accent); }
  .page[data-widget="Weather"] .note { margin: 0 0 6px; }
  .rows { margin: 0; }
  .rows div { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--panel-line); font-size: .8rem; }
  .rows div:last-child { border-bottom: 0; }
  .rows dd { margin: 0; color: var(--dim); text-align: end; }
  .meter { appearance: none; display: block; width: 100%; height: 3px; margin: 5px 0 0; border: 0; border-radius: 9px; background: var(--panel-line); }
  .meter::-webkit-meter-bar { height: 3px; border: 0; border-radius: 9px; background: var(--panel-line); }
  .meter::-webkit-meter-optimum-value { background: var(--widget-accent); border-radius: 9px; }
  .meter::-moz-meter-bar { background: var(--widget-accent); border-radius: 9px; }
  .rows:has(.meter) div { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
  .rows .meter { grid-column: 1 / -1; }
  .page[data-widget^="AiUsage"] .rows:has(.meter) div:has(.meter) { grid-template-columns: minmax(0,1fr) minmax(22px,.6fr) auto; align-items: center; }
  .page[data-widget^="AiUsage"] .rows .meter { grid-column: 2; grid-row: 1; margin: 0; }
  .page[data-widget^="AiUsage"] .rows div:has(.meter) dd { grid-column: 3; }
  [data-open="true"] .rows div { padding: 9px 0; }
  [data-open="true"] .page[data-widget="Audio"] .rows div { padding-block: 5px; }
  [data-open="true"] .meter, [data-open="true"] .meter::-webkit-meter-bar { height: 5px; }
  [data-open="false"] .readings dd { margin-top: 2px; }
  [data-open="false"] .readings .meter { margin-top: 3px; }
  [data-open="false"] .page[data-widget="SystemStats"] .readings { gap: 4px; }
  [data-open="false"] .page[data-widget="SystemStats"] .readings div { padding-block: 3px; }
  [data-open="false"] .page[data-widget="SystemStats"] .readings :is(dt, dd) { line-height: 1.15; }
  [data-open="false"] .page[data-widget="SystemStats"] .readings dd { font-size: .82rem; }
  [data-open="false"] .rows div { padding-block: 4px; }
  [data-open="true"] .page:has(.readings, .rows, .tiles) { align-content: safe center; }
  [data-open="false"] .page[data-widget="Audio"] .rows { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); column-gap: 7px; margin-top: 2px; }
  [data-open="false"] .page[data-widget="Audio"] .rows div { display: grid; align-content: start; gap: 2px; border: 0; font-size: .68rem; line-height: 1.2; }
  [data-open="false"] .page[data-widget="Audio"] .rows dd { text-align: start; }
  .tiles, .timer-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tiles button, .timer button { min-height: 32px; border: 1px solid #ffffff26; border-radius: 6px; background: #ffffff0a; color: var(--white); padding: 4px 9px; font-size: .82rem; }
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); }
  .tiles button { display: grid; place-items: center; gap: 6px; min-width: 0; min-height: 76px; padding: 6px 2px; font-size: .72rem; }
  .tiles button[aria-pressed="true"] { background: var(--widget-accent); color: var(--panel); border-color: var(--widget-accent); }
  .tiles button .icon { width: 19px; height: 19px; }
  [data-open="true"] .tiles button { min-height: 108px; font-size: .85rem; }
  .sample-volume { display: grid; grid-template-columns: 1fr auto; gap: 5px; align-items: center; font-size: .82rem; }
  .sample-volume input { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); }
  .timer [data-action="start"] { background: var(--accent); color: var(--panel); }
  .timer label { color: var(--dim); font-size: .82rem; }
  .timer input { width: 4.5em; color: var(--white); background: var(--panel); border: 1px solid #ffffff40; border-radius: 5px; padding: 3px 5px; }
  progress { width: 100%; height: 8px; accent-color: var(--accent); }
  .media { display: flex; flex-direction: column; gap: 6px; }
  audio { flex: none; }
  .media p { margin: 0; overflow-wrap: anywhere; }
  .media-info { display: grid; grid-template-columns: auto minmax(0,1fr); align-items: center; gap: 8px; }
  .media-art { display: grid; place-items: center; width: 36px; aspect-ratio: 1; border: 1px solid #dbb5f45e; border-radius: 7px; color: #f2dcff; background: radial-gradient(ellipse at 25% 85%, #9d5477, #503f82 58%, #25334f); }
  [data-open="true"] .media-art { width: 56px; }
  [data-open="true"] .media-art .icon { width: 22px; height: 22px; }
  .media .track { font-weight: 600; font-size: .86rem; }
  [data-open="true"] .media .track { font-size: 1.12rem; }
  [data-open="true"] .media { justify-content: safe center; gap: 10px; }
  .media .file-label { font-size: .75rem; }
  .file-label { align-self: start; font-size: .85rem; }
  input[type="file"] { width: 100%; max-width: 100%; font-size: .83rem; color: var(--dim); }
  input::file-selector-button { font: inherit; border: 0; border-radius: 7px; padding: 6px 9px; background: var(--accent); color: var(--ink); cursor: pointer; }
  audio { width: 100%; height: 36px; }
  .pages { display: flex; align-items: center; justify-content: center; gap: var(--space-2); margin-top: var(--space-1); color: var(--dim); font-size: .76rem; font-variant-numeric: tabular-nums; }
  .page-step { width: 36px; min-height: 28px; border: 0; border-radius: 6px; background: none; color: var(--dim); }
  .page-step .icon { width: 13px; height: 13px; }
  .page-step, .tiles button, .timer button { transition: background-color 140ms ease, color 140ms ease, transform 110ms ease-out; }
  .page-step:active, .tiles button:active, .timer button:active { transform: scale(.95); }
  @media (hover: hover) { .tiles button:hover:not([aria-pressed="true"]) { background: #ffffff19; } }
  .page-step:hover, .timer button:hover { background-color: #ffffff1f; color: var(--white); }
  .dock { position: absolute; bottom: 9px; left: 50%; translate: -50% 0; display: flex; gap: 4px; align-items: center; max-width: calc(100% - 16px); overflow-x: auto; border: 1px solid #ffffff3b; border-radius: 8px; padding: 4px; background: #121925ec; color: var(--white); }
  .dock span { padding: 4px 7px; font-size: .75rem; white-space: nowrap; }
  .fields { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding-top: 12px; font-size: .8rem; }
  .fields label { display: grid; min-width: 0; gap: 4px; color: var(--muted); }
  select { width: 100%; min-width: 0; color: var(--ink); background: #fff; border: 1px solid #bac4d1; border-bottom-color: #8995a5; border-radius: 5px; padding: 6px; }
  .hint { line-height: 1.5; margin: 14px 0 0; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  @media (max-width: 720px) { .screens { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) {
    .island, .indicator, .page-step, .tiles button, .timer button { transition: none; }
    .page-step:active, .tiles button:active, .timer button:active { transform: none; }
  }
</style>
<main>
  <header><span class="brand">OpenTaskbar</span><span class="tag">Prototip · Örnek veriler</span></header>
  <div class="intro">
    <h1>Dinamik Ada</h1>
  </div>
  <div class="screens"></div>
  <p class="hint">Ada başlığı boyutu değiştirir. Kompakt görünümde üç nokta kontrolleri açar. Sayfalar arasında yatay kaydırabilir veya sağ ve sol ok tuşlarını kullanabilirsin.</p>
</main>
<template id="monitor">
  <section class="monitor">
    <div class="monitor-heading"><h2></h2><span class="tag"></span></div>
    <div class="desktop">
      <div class="island" data-open="false">
        <div class="island-header">
          <button class="toggle" type="button" aria-pressed="false">
            <span class="widget-icon" aria-hidden="true"></span><span class="identity"></span><span class="summary"></span><span class="indicator" aria-hidden="true"></span>
          </button>
          <button class="controls-button" type="button" aria-label="Widget kontrolleri" aria-expanded="false"></button>
        </div>
        <div class="expand" hidden>
            <div class="content">
              <section class="page clock" data-widget="Clock" aria-label="Tarih ve saat">
                <small>Yerel saat</small><time></time><span class="date"></span>
              </section>
              <section class="page media" data-widget="Media" aria-label="Medya kontrolü" hidden>
                <div class="media-info">
                  <span class="media-art" aria-hidden="true"></span>
                  <div><p class="track">Gece treni</p><span class="date media-meta">Örnek parça · 3:42</span></div>
                </div>
                <label class="file-label">Yerel ses dosyası <input type="file" accept="audio/*"></label>
                <audio controls hidden></audio>
              </section>
              <nav class="pages" aria-label="Widget sayfaları">
                <button class="page-step" type="button" data-direction="-1" aria-label="Önceki widget">‹</button>
                <span class="page-index"></span>
                <button class="page-step" type="button" data-direction="1" aria-label="Sonraki widget">›</button>
              </nav>
            </div>
        </div>
        <span class="visually-hidden announcement" role="status"></span>
      </div>
      <div class="dock" aria-label="Dock widget’ları" hidden></div>
    </div>
    <div class="fields">
      <label>Widget <select class="widget-picker"></select></label>
      <label>Konum <select class="position-picker"><option value="island">Ada</option><option value="dock">Dock</option></select></label>
    </div>
  </section>
</template>

    const summary = monitor.querySelector('.summary');
    const time = monitor.querySelector('time');
    const date = monitor.querySelector('.date');
    const audio = monitor.querySelector('audio');
    const track = monitor.querySelector('.track');
    const picker = monitor.querySelector('.widget-picker');
    const placement = monitor.querySelector('.position-picker');
    const positions = new Map([...catalog.keys()].map(id => [id, 'island']));
    const timers = new Map();
    const pagesById = new Map([...monitor.querySelectorAll('.page')].map(page => [page.dataset.widget, page]));
    for (const { group, items } of widgets) {
      const options = document.createElement('optgroup');
      options.label = group;
      for (const widget of items) {
        options.append(new Option(widget.name, widget.id));
        if (pagesById.has(widget.id)) continue;
        const page = buildPage(widget);
        pagesById.set(widget.id, page);
        nav.before(page);
        if (widget.timer) timers.set(widget.id, connectTimer(page, widget.timer));
      }
      picker.append(options);
    }
    const day = pagesById.get('DayProgress');
    const dayMeter = day.querySelector('progress');
    const dayValue = day.querySelector('output');
    const dayRemaining = day.querySelector('.date');
    let selected = initialPage;
    let pageAnimation;
    let audioUrl;
    let gesture;
    let wheelTotal = 0;
    let lastWheel = -Infinity;
    let wheelConsumed = false;
    monitor.querySelector('h2').append(icon('IconMonitor'), document.createTextNode('Ekran ' + index));
    monitor.querySelector('.media-art').append(icon('IconMusic'));
    toggle.querySelector('.indicator').append(icon('IconChevronDown'));
    for (const button of nav.querySelectorAll('button')) {
      button.replaceChildren(icon(button.dataset.direction === '-1' ? 'IconChevronLeft' : 'IconChevronRight'));
    }
    monitor.querySelector('.monitor-heading .tag').textContent = index === 1 ? 'Ana ekran' : 'İkinci ekran';
    expand.id = 'island-content-' + index;
    summary.id = 'island-summary-' + index;
    toggle.setAttribute('aria-controls', expand.id);
    toggle.setAttribute('aria-describedby', summary.id);
    controlsButton.setAttribute('aria-controls', expand.id);

    function setControls(visible, restoreFocus = false) {
      controlsButton.setAttribute('aria-expanded', String(visible));
      expand.hidden = !visible && island.dataset.open !== 'true';
      if (visible && !reduceMotion.matches) {
        expand.animate(
          [{ opacity: 0, transform: 'translateY(-4px)' }, { opacity: 1, transform: 'translateY(0)' }],
          { duration: 145, easing: 'ease-out' }
        );
      }
      if (restoreFocus) controlsButton.focus();
    }

    function setOpen(open) {
      island.dataset.open = String(open);
      toggle.setAttribute('aria-pressed', String(open));
      setControls(false);
    }

    function islandPages() {
      return [...positions.keys()].filter(widget => positions.get(widget) === 'island');
    }

    function update() {
      const now = new Date();
      const localTime = timeFormat.format(now);
      time.textContent = localTime;
      time.dateTime = localTime;
      date.textContent = dateFormat.format(now);
      const minutes = now.getHours() * 60 + now.getMinutes();
      const dayPercent = percentFormat.format(minutes / 1440);
      dayMeter.value = minutes / 1440;
      if (dayValue.value !== dayPercent) dayValue.value = dayPercent;
      const remaining = 1440 - minutes;
      dayRemaining.textContent = Math.floor(remaining / 60) + ' sa. ' + remaining % 60 + ' dk. kaldı';
      let currentTimer;
      for (const [id, tick] of timers) {
        const value = tick();
        if (id === selected) currentTimer = value;
      }
      const compact = {
        Clock: localTime, DayProgress: dayPercent,
        SystemStats: 'CPU %24 · RAM %58', NetSpeed: '↓ 42,8 Mb/sn', Storage: '192 GB boş',
        BluetoothBattery: '%82', Battery: '%76 · Şarjda',
        Media: audio.error ? 'Oynatılamadı' : audioUrl ? (audio.paused ? 'Duraklatıldı' : 'Çalıyor') : 'Gece treni'
      };
      const selectedPage = pagesById.get(selected);
      const enabledTiles = selectedPage?.querySelectorAll('.tiles [aria-pressed="true"]').length;
      const value = currentTimer ?? compact[selected] ??
        (selected === 'Audio' ? '%' + selectedPage.querySelector('input').value :
          selected === 'QuickSettings' ? enabledTiles + ' açık' : samples[selected]?.[0] ?? '');
      if (summary.textContent !== value) summary.textContent = value;
      const dockClock = dock.querySelector('[data-clock]');
      if (dockClock) dockClock.textContent = localTime;
    }

    function showPage(widget, announce = false, syncPicker = true, direction = 0) {
      const changed = selected !== widget;
      selected = widget;
      const definition = catalog.get(widget);
      island.dataset.widget = widget ?? '';
      identity.textContent = ({
        Clock: 'Saat', SystemStats: 'Sistem', NetSpeed: 'Ağ', Media: 'Medya',
        DayProgress: 'Gün', QuickSettings: 'Hızlı ayarlar'
      })[widget] ?? definition?.short ?? definition?.name ?? '';
      if (definition) {
        const [key, accent] = appearances[widget] ?? ['Logo' + definition.name, '#d2c5fc'];
        widgetIcon.replaceChildren(icon(key));
        island.style.setProperty('--widget-accent', accent);
        toggle.setAttribute('aria-label', definition.name + ' geniş görünüm');
        controlsButton.setAttribute('aria-label', definition.name + ' kontrolleri');
      }
      for (const [id, page] of pagesById) {
        if (id !== widget && page.contains(document.activeElement)) toggle.focus();
        page.hidden = id !== widget;
      }
      const pages = islandPages();
      nav.hidden = pages.length < 2;
      nav.querySelector('.page-index').textContent = (pages.indexOf(widget) + 1) + ' / ' + pages.length;
      island.hidden = !widget;
      if (syncPicker && widget) picker.value = widget;
      placement.value = positions.get(picker.value);
      if (announce && definition) monitor.querySelector('.announcement').textContent = definition.name + ' sayfası';
      if (changed) {
        pageAnimation?.cancel();
        const page = pagesById.get(widget);
        if (page && !reduceMotion.matches) {
          pageAnimation = page.animate(
            [{ opacity: .45, transform: 'translateX(' + direction * 6 + 'px)' }, { opacity: 1, transform: 'translateX(0)' }],
            { duration: 155, easing: 'cubic-bezier(.23,1,.32,1)' }
          );
        }
      }
      update();
    }

    function movePage(direction) {
      const pages = islandPages();
      if (pages.length < 2) return;
      showPage(pages[(pages.indexOf(selected) + direction + pages.length) % pages.length], true, true, direction);
    }

    toggle.addEventListener('click', () => setOpen(island.dataset.open !== 'true'));
    controlsButton.addEventListener('click', () => setControls(expand.hidden));
    monitor.addEventListener('focusout', event => {
      if (island.dataset.open === 'false' && event.relatedTarget && !island.contains(event.relatedTarget)) {
        setControls(false);
      }
    });
    monitor.querySelector('.desktop').addEventListener('click', event => {
      if (!island.contains(event.target) && island.dataset.open === 'false') setControls(false);
    });
    nav.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (button) movePage(Number(button.dataset.direction));
    });
    island.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        if (island.dataset.open === 'true') {
          setOpen(false);
          toggle.focus();
        } else if (!expand.hidden) setControls(false, true);
        return;
      }
      if (event.target.closest('input, audio')) return;
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
        movePage(event.key === 'ArrowRight' ? 1 : -1);
      }
    });
    island.addEventListener('wheel', event => {
      if (islandPages().length < 2 || event.ctrlKey || event.target.closest('input, audio')) return;
      const horizontal = Math.abs(event.deltaX) > Math.abs(event.deltaY);
      const page = event.target.closest('.page');
      if (!horizontal && page && page.scrollHeight > page.clientHeight) return;
      const delta = horizontal ? event.deltaX : event.deltaY;
      if (!delta) return;
      event.preventDefault();
      if (event.timeStamp - lastWheel > 150) {
        wheelTotal = 0;
        wheelConsumed = false;
      }
      lastWheel = event.timeStamp;
      if (wheelConsumed) return;
      wheelTotal += delta * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? 100 : 1);
      if (Math.abs(wheelTotal) >= 24) {
        movePage(Math.sign(wheelTotal));
        wheelConsumed = true;
      }
    }, { passive: false });
    island.addEventListener('pointerdown', event => {
      if (event.pointerType !== 'touch' || event.target.closest('input, audio, button:not(.toggle)')) return;
      gesture = { id: event.pointerId, x: event.clientX, y: event.clientY };
    });
    island.addEventListener('pointerup', event => {
      if (!gesture || gesture.id !== event.pointerId) return;
      const { x, y } = gesture;
      gesture = undefined;
      const dx = event.clientX - x;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(event.clientY - y)) {
        event.preventDefault();
        movePage(dx < 0 ? 1 : -1);
        toggle.addEventListener('click', suppressSwipeClick, { capture: true, once: true });
        setTimeout(() => toggle.removeEventListener('click', suppressSwipeClick, true), 350);
      }
    });
    function suppressSwipeClick(event) { event.stopImmediatePropagation(); }
    island.addEventListener('pointercancel', () => { gesture = undefined; });

    picker.addEventListener('change', () => {
      placement.value = positions.get(picker.value);
      if (placement.value === 'island') showPage(picker.value, true);
    });
    placement.addEventListener('change', () => {
      const widget = picker.value;
      positions.set(widget, placement.value);
      const dockItems = [...positions].filter(([, position]) => position === 'dock');
      dock.replaceChildren(...dockItems.map(([id]) => {
        const item = document.createElement('span');
        const definition = catalog.get(id);
        item.textContent = definition.short ?? definition.name;
        if (id === 'Clock') item.dataset.clock = '';
        return item;
      }));
      dock.hidden = dockItems.length === 0;
      const pages = islandPages();
      const next = placement.value === 'island' ? widget : pages.includes(selected) ? selected : pages[0];
      showPage(next, false, false);
    });

    monitor.querySelector('.media input').addEventListener('change', event => {
      const file = event.target.files[0];
      if (!file) return;
      if (audioUrl) URL.revokeObjectURL(audioUrl);
      audioUrl = URL.createObjectURL(file);
      audio.src = audioUrl;
      track.textContent = file.name;
      monitor.querySelector('.media-meta').textContent = 'Yerel ses dosyası';
      audio.hidden = false;
      update();
    });
    for (const event of ['play', 'pause', 'ended']) audio.addEventListener(event, update);
    audio.addEventListener('error', () => {
      track.textContent = 'Bu ses dosyası oynatılamadı.';
      update();
    });
    setOpen(expanded);
    showPage(initialPage);
    screens.append(monitor);
    return update;
  }

  const monitors = [createMonitor(1, 'Clock', true), createMonitor(2, 'Media', false)];
  setInterval(() => monitors.forEach(update => update()), 250);
</script>
</html>
