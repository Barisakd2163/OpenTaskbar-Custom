<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinamik Ada · OpenTaskbar</title>
<style>
  :root {
    color-scheme: light;
    font-family: "Segoe UI", sans-serif;
    --paper: #eef2f7;
    --ink: #20242c;
    --muted: #525c6a;
    --line: #d9e0e9;
    --surface: #f9fbfe;
    --blue: #005fb8;
    --panel: #101217;
    --panel-raised: #181b22;
    --panel-line: #333843;
    --white: #fafafa;
    --dim: #b7b8c1;
    --accent: #c2d9ff;
    --island-compact-height: 50px;
    --island-open-height: 246px;
    --island-controls-height: 174px;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --motion: 220ms cubic-bezier(.23,1,.32,1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); }
  button, select, input { font: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  [hidden] { display: none !important; }
  main { width: min(1352px, 100%); margin: auto; padding: 0 clamp(16px, 4vw, 64px) 36px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 58px; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 600; font-size: .9rem; display: flex; align-items: center; gap: 9px; }
  .brand::before { content: ""; width: 17px; height: 14px; border: 2px solid var(--blue); border-radius: 4px; background: linear-gradient(var(--blue),var(--blue)) center 80% / 9px 2px no-repeat; }
  .tag, .hint { color: var(--muted); font-size: .86rem; }
  .intro { margin: 28px 0 24px; }
  h1 { margin: 0; font-size: clamp(1.85rem, 4vw, 2.7rem); line-height: 1.15; letter-spacing: -.035em; font-weight: 650; }
  .screens { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
  .monitor { min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: 0 2px 5px #233b5710; }
  .monitor-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 2px 12px; }
  h2 { font-size: .95rem; font-weight: 600; margin: 0; }
  .monitor-heading h2 { display: flex; align-items: center; gap: 7px; }
  .monitor-heading .icon { color: var(--blue); }
  .desktop {
    --island-shoulder: 12px;
    position: relative; min-height: 352px; padding: 0 calc(var(--island-shoulder) + 2px) 58px;
    border: 1px solid #263957; border-radius: 8px; isolation: isolate;
    background:
      radial-gradient(ellipse at 116% 119%, #172650 23%, #304f98 34%, #90b3fb 45%, #304e86 53%, transparent 72%),
      radial-gradient(ellipse at 11% 125%, #a2c1ed 0%, #366094 38%, transparent 68%),
      linear-gradient(142deg, #172941, #2e4b76 62%, #7199c7);
  }
  .monitor:nth-child(2) .desktop {
    background:
      radial-gradient(ellipse at -15% 114%, #142d46 19%, #2e6985 38%, #a4ced7 49%, #42849a 57%, transparent 76%),
      radial-gradient(ellipse at 100% 112%, #7caab6 0%, #325e75 48%, transparent 75%),
      linear-gradient(150deg, #24394d, #315176 68%, #7ea9bc);
  }
  .island {
    position: relative;
    display: flex; flex-direction: column;
    width: min(320px, 100%); height: var(--island-compact-height); max-height: var(--island-compact-height); margin: 0 auto; color: var(--white); background: var(--panel);
    --widget-accent: var(--accent);
    border-radius: 0 0 17px 17px;
    box-shadow: 0 16px 30px -10px #040811a6, inset 0 -1px #ffffff12;
    transition: width var(--motion), height var(--motion), border-radius var(--motion); touch-action: pan-y;
  }
  .island::before, .island::after {
    content: ""; position: absolute; top: 0; pointer-events: none;
    width: var(--island-shoulder); height: var(--island-shoulder);
    background: radial-gradient(circle at left bottom, transparent calc(var(--island-shoulder) - 0.5px), var(--panel) var(--island-shoulder));
  }
  .island::before { right: 100%; }
  .island::after { left: 100%; scale: -1 1; }
  .island[data-open="true"] { width: min(100%, 416px); height: var(--island-open-height); max-height: var(--island-open-height); border-radius: 0 0 22px 22px; }
  .island-header, .page { cursor: grab; user-select: none; }
  .island[data-dragging="true"] :is(.island-header, .toggle, .page) { cursor: grabbing; }
  .drag-surface { translate: var(--drag-offset, 0px) 0; }
  .island[data-dragging="true"] .page { translate: var(--drag-offset, 0px) 0; }
  .island[data-dragging="true"] .drag-surface { opacity: .72; }
  .inline-actions { display: flex; gap: 3px; flex: none; align-items: center; }
  [data-open="true"] .inline-actions { display: none; }
  .inline-actions button { display: grid; place-items: center; height: 30px; width: 29px; border: 1px solid var(--panel-line); border-radius: 6px; background: #ffffff08; color: var(--white); padding: 0; font-size: .72rem; }
  .inline-actions button[aria-pressed="true"] { background: var(--widget-accent); border-color: var(--widget-accent); color: var(--panel); }
  .inline-actions button:disabled { opacity: .5; cursor: default; }
  .inline-actions input { width: clamp(45px, 7vw, 78px); margin: 0; accent-color: var(--widget-accent); }
  .inline-actions input[data-seek] { width: clamp(38px, 5vw, 57px); }
  .inline-actions .icon { width: 14px; height: 14px; }
  [data-open="false"][data-widget="QuickSettings"] .summary { display: none; }
  [data-open="false"][data-widget="QuickSettings"] .identity { font-size: .73rem; }
  [data-open="false"][data-widget="Media"] .identity { display: none; }
  [data-open="false"][data-widget="Media"] .summary { flex: 1; max-width: none; margin: 0; text-align: start; }
  .island :focus-visible { outline-color: var(--accent); outline-offset: -3px; }
  .island-header { display: flex; align-items: center; flex: 0 0 var(--island-compact-height); min-width: 0; padding: 0 var(--space-2); gap: var(--space-1); }
  .toggle { display: flex; align-items: center; gap: var(--space-2); flex: 1; min-width: 0; height: 38px; padding: 0 var(--space-2); border: 0; border-radius: 8px; color: inherit; background: transparent; text-align: left; }
  .controls-button { display: grid; place-items: center; width: 32px; height: 32px; flex: none; padding: 0; border: 1px solid transparent; border-radius: 7px; color: var(--dim); background: none; }
  .controls-button::before { content: ""; width: 3px; height: 3px; border-radius: 50%; background: currentColor; box-shadow: 5px 0 currentColor, -5px 0 currentColor; }
  .controls-button[aria-expanded="true"] { color: var(--white); border-color: var(--panel-line); background: #ffffff10; }
  @media (hover: hover) { .toggle:hover, .controls-button:hover { background: #ffffff0e; } }
  .icon { flex: none; width: 15px; height: 15px; vertical-align: middle; }
  .widget-icon { display: grid; place-items: center; flex: 0 0 24px; height: 24px; color: var(--widget-accent); }
  .widget-icon .icon { width: 17px; height: 17px; }
  .identity { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: .83rem; }
  .summary { flex: 0 1 auto; min-width: 0; max-width: 58%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--widget-accent); font-size: .82rem; font-weight: 600; font-variant-numeric: tabular-nums; margin-inline-start: auto; }
  .island[data-widget="Clock"] .summary, .island[data-widget="Stopwatch"] .summary,
  .island[data-widget="Countdown"] .summary, .island[data-widget="Focus"] .summary { font-size: 1rem; }
  .indicator { flex: none; color: var(--dim); transition: transform var(--motion); }
  [data-open="true"] .indicator { transform: rotate(180deg); }
  .expand { display: flex; flex: 1; min-height: 0; }
  [data-open="false"] .expand {
    position: absolute; z-index: 2; inset: calc(100% + var(--space-2)) 0 auto;
    height: var(--island-controls-height); max-height: var(--island-controls-height);
    border: 1px solid var(--panel-line); border-radius: 12px;
    background: var(--panel); box-shadow: 0 12px 28px #080c1859;
  }
  .content { display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; padding: var(--space-2) var(--space-2) var(--space-1); }
  .page {
    flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: #686b77 transparent;
    border: 1px solid var(--panel-line); border-radius: 9px;
    background: var(--panel-raised); padding: var(--space-2); overflow-wrap: anywhere;
  }
  [data-open="true"] .content { padding: 0 var(--space-3) var(--space-2); }
  [data-open="true"] .page { padding: var(--space-3); }
  .page :is(.week, .day-scale) { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; }
  .week { margin: 3px 0 0; padding: 0; list-style: none; }
  .week li { display: grid; gap: 3px; justify-items: center; padding: 3px 1px; border-radius: 5px; font-size: .72rem; color: var(--dim); }
  .week li b { font-weight: 550; color: var(--white); font-variant-numeric: tabular-nums; }
  .week [aria-current="date"] { background: var(--widget-accent); color: var(--panel); }
  .week [aria-current="date"] b { color: inherit; }
  .page.clock { grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 2px 8px; }
  .clock small { grid-column: 1 / -1; }
  .clock .week { grid-column: 1 / -1; border-top: 1px solid var(--panel-line); padding-top: 4px; }
  .clock .date { text-align: right; }
  @media (max-width: 480px) { [data-open="true"] .clock { grid-template-columns: minmax(0, 1fr); } [data-open="true"] .clock .date { text-align: left; } }
  .day-scale { font-size: .66rem; font-variant-numeric: tabular-nums; color: var(--dim); margin-bottom: 2px; }
  .day-scale span:not(:first-child):not(:last-child) { text-align: center; }
  .day-scale span:last-child { text-align: end; }
  .sample-history { display: grid; gap: 5px; margin-top: 7px; }
  .sample-history small { color: var(--dim); font-size: .68rem; }
  .history-bars { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; align-items: end; gap: 3px; height: 29px; border-bottom: 1px solid var(--panel-line); }
  .history-bars span { background: color-mix(in srgb, var(--widget-accent) 36%, var(--panel-raised)); border-radius: 2px 2px 0 0; }
  .history-bars span:last-child { background: var(--widget-accent); }
  .forecast { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin: 7px 0 0; padding: 6px 0 0; list-style: none; border-top: 1px solid var(--panel-line); }
  .forecast li { display: grid; grid-template-columns: auto auto; align-items: center; justify-content: center; gap: 2px 3px; font-size: .7rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  .forecast li time { grid-column: 1 / -1; text-align: center; }
  .forecast b { color: var(--white); font-weight: 550; }
  .forecast .icon { color: var(--widget-accent); }
  [data-open="false"] .forecast { margin-top: 4px; padding-top: 3px; }
  [data-open="false"] .page[data-widget="Weather"] .readings div { padding-block: 4px; }
  [data-open="true"] .page[data-widget="Weather"] .readings { grid-template-columns: 1.2fr 1fr 1fr; }
  [data-open="true"] .page[data-widget="Weather"] .readings div:first-child { grid-row: auto; }
  [data-open="true"] .page[data-widget="Weather"] .readings div:first-child dd { font-size: 1.4rem; }
  .sample-player { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; }
  .sample-player button { width: 29px; height: 29px; border: 0; border-radius: 6px; background: var(--widget-accent); color: var(--panel); font-size: .72rem; }
  .sample-player input { width: 100%; margin: 0; accent-color: var(--widget-accent); }
  .sample-player output { font-size: .72rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  .file-action { position: relative; align-self: start; padding: 4px 8px; border: 1px solid var(--panel-line); border-radius: 5px; color: var(--dim); font-size: .72rem; cursor: pointer; }
  .file-action:hover { color: var(--white); background: #ffffff0a; }
  .file-action:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .profile { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 9px; align-items: center; margin-bottom: 4px; }
  .profile .icon { box-sizing: content-box; width: 21px; height: 21px; padding: 8px; border: 1px solid var(--panel-line); border-radius: 9px; color: var(--widget-accent); background: color-mix(in srgb, var(--widget-accent) 12%, var(--panel)); }
  .profile span { display: grid; gap: 3px; min-width: 0; font-size: .75rem; color: var(--dim); }
  .profile strong { color: var(--white); font-size: .96rem; font-weight: 650; }
  .quota-profile { border-bottom: 1px solid var(--panel-line); padding-bottom: 2px; }
  .quota-profile .icon { width: 17px; height: 17px; padding: 5px; }
  .page[data-widget^="AiUsage"] .rows div { padding-block: 4px; line-height: 1.2; }
  .page[data-widget^="AiUsage"] .rows dd { color: var(--widget-accent); }
  .page[data-widget^="AiUsage"] .rows .meter { height: 4px; }
  [data-open="false"] .quota-profile { margin-bottom: 3px; padding-bottom: 4px; gap: 8px; }
  [data-open="false"] .quota-profile .icon { padding: 5px; }
  .page[data-widget="AiUsageCopilot"] .rows dd { font-size: 1.55rem; }
  .capacity { display: grid; gap: 6px; padding: 8px 10px; margin-bottom: 5px; border: 1px solid var(--panel-line); border-radius: 8px; }
  .capacity dd { font-size: 1.55rem; font-weight: 650; line-height: 1; color: var(--widget-accent); font-variant-numeric: tabular-nums; }
  .capacity dt { font-size: .7rem; color: var(--dim); }
  .capacity meter { margin: 0; }
  .page:is([data-widget="Battery"], [data-widget="BluetoothBattery"], [data-widget="Storage"]) .rows div { padding-block: 5px; }
  .page[data-widget="Clock"] .week { background: #c2d9ff0a; border-radius: 6px; }
  .page[data-widget="DayProgress"] progress { height: 12px; }
  .page[data-widget="DayProgress"] output { color: var(--widget-accent); }
  .timer .timer-state { color: var(--widget-accent); font-size: .72rem; font-weight: 550; }
  .page.timer { gap: 4px; }
  .page[data-widget="Focus"] { background: radial-gradient(ellipse at 88% 0%, #6554a329, transparent 64%), var(--panel-raised); }
  .page[data-widget="Countdown"] { background: radial-gradient(ellipse at 88% 0%, #9561272e, transparent 64%), var(--panel-raised); }
  .page[data-widget="Stopwatch"] { background: repeating-linear-gradient(90deg, transparent 0 15px, #b1c9ff0a 15px 16px) top / 100% 6px no-repeat, var(--panel-raised); }
  .page[data-widget="SystemStats"] { background: repeating-linear-gradient(0deg, transparent 0 17px, #a8c6ff08 17px 18px), var(--panel-raised); }
  .page[data-widget="NetSpeed"] .history-bars { background: repeating-linear-gradient(0deg, #94dfec14 0 1px, transparent 1px 8px); }
  .page[data-widget="Weather"] .readings div:first-child { background: #ffd19712; }
  .page[data-widget="Audio"] .sample-volume { padding: 4px 7px; border: 1px solid var(--panel-line); border-radius: 8px; background: #c4baff0b; }
  .page[data-widget="BluetoothBattery"] .capacity { border-inline-start: 2px solid var(--widget-accent); }
  .page[data-widget="Storage"] .capacity .meter { height: 7px; }
  .page[data-widget="Storage"] .capacity .meter::-webkit-meter-bar { height: 7px; }
  .page[data-widget="Battery"] .capacity dd::after { content: ""; display: inline-block; width: 14px; height: 7px; margin-inline-start: 8px; border: 1px solid currentColor; border-radius: 2px; vertical-align: middle; }
  .page[data-widget="AiUsageAntigravity"] .rows div:last-child dd { color: var(--dim); }
  .page[data-widget="AiUsageCursor"] .rows .meter { opacity: .85; }
  .page[data-widget="AiUsageOpenRouter"] .rows dd { letter-spacing: -.035em; }
  [data-open="true"] .page[data-widget^="AiUsage"] .rows div { padding-block: 4px; }
  [data-open="true"] .page[data-widget^="AiUsage"] .rows dd { color: var(--white); font-size: .98rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  [data-open="true"] .page:is([data-widget="AiUsageDeepSeek"], [data-widget="AiUsageOpenRouter"]) .rows div { display: grid; gap: 4px; }
  [data-open="true"] .page:is([data-widget="AiUsageDeepSeek"], [data-widget="AiUsageOpenRouter"]) .rows dd { text-align: start; font-size: 1.9rem; }
  [data-open="true"] .controls-button { display: none; }
  .clock, .timer, .progress-page { display: grid; align-content: safe center; gap: 6px; }
  .clock small, .timer small { color: var(--widget-accent); font-weight: 600; }
  .clock time, .timer output, .progress-page output { color: var(--white); font-size: 1.85rem; line-height: 1.05; font-weight: 600; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
  [data-open="true"] :is(.clock time, .timer output, .progress-page output) { font-size: clamp(2.3rem, 6vw, 3.5rem); }
  .date, .note { color: var(--dim); font-size: .82rem; }
  .note { margin: 8px 0 0; line-height: 1.4; }
  .readings { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 65px), 1fr)); gap: 5px; margin: 0; }
  .readings div { padding: 5px 6px; border: 1px solid var(--panel-line); border-radius: 6px; min-width: 0; background: #0d0f152e; }
  .readings dt { color: var(--dim); font-size: .69rem; }
  .readings dd { margin: 3px 0 0; font-size: .88rem; font-weight: 550; font-variant-numeric: tabular-nums; }
  .page[data-widget="SystemStats"] .readings { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .page[data-widget="SystemStats"] .readings div { grid-column: span 2; border: 0; border-bottom: 1px solid var(--panel-line); border-radius: 0; background: transparent; }
  .page[data-widget="SystemStats"] .readings div:nth-child(n+4) { grid-column: span 3; }
  .page[data-widget="NetSpeed"] .readings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  [data-open="true"] .readings div { padding: 9px; }
  [data-open="true"] .readings dd { font-size: 1.15rem; }
  [data-open="true"] .page[data-widget="SystemStats"] .readings div { padding-block: 5px; }
  [data-open="true"] .page[data-widget="Weather"] .readings div { padding-block: 5px; }
  [data-open="true"] .page[data-widget="Weather"] .readings div:not(:first-child) dd { font-size: .95rem; }
  [data-open="true"] .page[data-widget="Weather"] .readings div:first-child dd { color: var(--widget-accent); }
  .page[data-widget="Weather"] .note { margin: 0 0 6px; }
  .rows { margin: 0; }

  .rows dd { margin: 0; color: var(--dim); text-align: end; }

  .meter::-webkit-meter-bar { height: 3px; border: 0; border-radius: 9px; background: var(--panel-line); }
  .meter::-webkit-meter-optimum-value { background: var(--widget-accent); border-radius: 9px; }
  .meter::-moz-meter-bar { background: var(--widget-accent); border-radius: 9px; }

  .rows .meter { grid-column: 1 / -1; }

  [data-open="true"] .meter, [data-open="true"] .meter::-webkit-meter-bar { height: 5px; }

  [data-open="false"] .readings .meter { margin-top: 3px; }
  [data-open="false"] .page[data-widget="SystemStats"] .readings { gap: 4px; }

  [data-open="false"] .page[data-widget="SystemStats"] .readings :is(dt, dd) { line-height: 1.15; }
  [data-open="false"] .page[data-widget="SystemStats"] .readings dd { font-size: .82rem; }
  [data-open="false"] .rows div { padding-block: 4px; }

  [data-open="false"] .page[data-widget="Audio"] .rows dd { text-align: start; }

  .tiles button, .timer button { min-height: 32px; border: 1px solid #ffffff26; border-radius: 6px; background: #ffffff0a; color: var(--white); padding: 4px 9px; font-size: .82rem; }

  .tiles button { display: grid; place-items: center; gap: 6px; min-width: 0; min-height: 76px; padding: 6px 2px; font-size: .72rem; }
  .tiles button[aria-pressed="true"] { background: var(--widget-accent); color: var(--panel); border-color: var(--widget-accent); }
  .tiles button .icon { width: 19px; height: 19px; }
  [data-open="true"] .tiles button { min-height: 108px; font-size: .85rem; }
  .sample-volume { display: grid; grid-template-columns: 1fr auto; gap: 5px; align-items: center; font-size: .82rem; }

        Clock: 'Saat', SystemStats: 'Sistem', NetSpeed: 'Ağ', Media: 'Medya',
        DayProgress: 'Gün', QuickSettings: 'Hızlı ayarlar'
      })[widget] ?? definition?.short ?? definition?.name ?? '';
      if (definition) {
        const [key, accent] = appearances[widget];
        widgetIcon.replaceChildren(icon(key));
        island.style.setProperty('--widget-accent', accent);
        toggle.setAttribute('aria-label', definition.name + ' geniş görünüm');
        controlsButton.setAttribute('aria-label', definition.name + ' kontrolleri');
      }
      for (const [id, page] of pagesById) {
        if (id !== widget && page.contains(document.activeElement)) toggle.focus();
        page.hidden = id !== widget;
      }
      const pages = islandPages();
      nav.hidden = pages.length < 2;
      nav.querySelector('.page-index').textContent = (pages.indexOf(widget) + 1) + ' / ' + pages.length;
      island.hidden = !widget;
      if (syncPicker && widget) picker.value = widget;
      placement.value = positions.get(picker.value);
      if (announce && definition) monitor.querySelector('.announcement').textContent = definition.name + ' sayfası';
      if (changed) {
        pageAnimation?.cancel();
        const page = pagesById.get(widget);
        if (page && !reduceMotion.matches) {
          pageAnimation = page.animate(
            [{ opacity: .35, transform: 'translateX(' + direction * 16 + 'px)' }, { opacity: 1, transform: 'translateX(0)' }],
            { duration: 220, easing: 'cubic-bezier(.23,1,.32,1)' }
          );
          for (const element of [widgetIcon, identity, summary]) {
            element.getAnimations().forEach(animation => animation.cancel());
            element.animate(
              [{ opacity: .5, transform: 'translateX(' + direction * 7 + 'px)' }, { opacity: 1, transform: 'translateX(0)' }],
              { duration: 165, easing: 'cubic-bezier(.23,1,.32,1)' }
            );
          }
        }
      }
      update();
    }

    function movePage(direction) {
      const pages = islandPages();
      if (pages.length < 2) return;
      showPage(pages[(pages.indexOf(selected) + direction + pages.length) % pages.length], true, true, direction);
    }

    toggle.addEventListener('click', () => setOpen(island.dataset.open !== 'true'));
    controlsButton.addEventListener('click', () => setControls(expand.hidden));
    monitor.addEventListener('focusout', event => {
      if (island.dataset.open === 'false' && event.relatedTarget && !island.contains(event.relatedTarget)) {
        setControls(false);
      }
    });
    monitor.querySelector('.desktop').addEventListener('click', event => {
      if (!island.contains(event.target) && island.dataset.open === 'false') setControls(false);
    });
    nav.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (button) movePage(Number(button.dataset.direction));
    });
    island.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        if (island.dataset.open === 'true') {
          setOpen(false);
          toggle.focus();
        } else if (!expand.hidden) setControls(false, true);
        return;
      }
      if (event.target.closest('input, audio')) return;
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
        movePage(event.key === 'ArrowRight' ? 1 : -1);
      }
    });
    island.addEventListener('wheel', event => {
      if (islandPages().length < 2 || event.ctrlKey || event.target.closest('input, audio')) return;
      const horizontal = Math.abs(event.deltaX) > Math.abs(event.deltaY);
      const page = event.target.closest('.page');
      if (!horizontal && page && page.scrollHeight > page.clientHeight) return;
      const delta = horizontal ? event.deltaX : event.deltaY;
      if (!delta) return;
      event.preventDefault();
      if (event.timeStamp - lastWheel > 150) {
        wheelTotal = 0;
        wheelConsumed = false;
      }
      lastWheel = event.timeStamp;
      if (wheelConsumed) return;
      wheelTotal += delta * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? 100 : 1);
      if (Math.abs(wheelTotal) >= 24) {
        movePage(Math.sign(wheelTotal));
        wheelConsumed = true;
      }
    }, { passive: false });
    island.addEventListener('pointerdown', event => {
      suppressDragClick = false;
      if (!event.isPrimary || event.button !== 0 || islandPages().length < 2 ||
          event.target.closest('input, audio, label, button:not(.toggle)')) return;
      gesture = { id: event.pointerId, x: event.clientX, y: event.clientY, active: false };
    });
    island.addEventListener('pointermove', event => {
      if (!gesture || gesture.id !== event.pointerId) return;
      const dx = event.clientX - gesture.x;
      if (!gesture.active) {
        if (Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(event.clientY - gesture.y)) return;
        gesture.active = true;
        island.setPointerCapture(event.pointerId);
        island.dataset.dragging = 'true';
      }
      if (!reduceMotion.matches) island.style.setProperty('--drag-offset', Math.max(-18, Math.min(18, dx * .35)) + 'px');
    });
    function finishGesture(event) {
      if (!gesture || gesture.id !== event.pointerId) return;
      const dx = event.clientX - gesture.x;
      const active = gesture.active;
      gesture = undefined;
      delete island.dataset.dragging;
      island.style.removeProperty('--drag-offset');
      if (event.type !== 'pointerup' || !active) return;
      suppressDragClick = true;
      if (Math.abs(dx) >= 36) movePage(dx < 0 ? 1 : -1);
    }
    island.addEventListener('pointerup', finishGesture);
    island.addEventListener('pointercancel', finishGesture);
    island.addEventListener('lostpointercapture', finishGesture);
    island.addEventListener('click', event => {
      if (!suppressDragClick || event.detail === 0) return;
      suppressDragClick = false;
      event.stopImmediatePropagation();
    }, true);

    picker.addEventListener('change', () => {
      placement.value = positions.get(picker.value);
      if (placement.value === 'island') showPage(picker.value, true);
    });
    placement.addEventListener('change', () => {
      const widget = picker.value;
      positions.set(widget, placement.value);
      const dockItems = [...positions].filter(([, position]) => position === 'dock');
      dock.replaceChildren(...dockItems.map(([id]) => {
        const item = document.createElement('span');
        const definition = catalog.get(id);
        item.textContent = definition.short ?? definition.name;
        if (id === 'Clock') item.dataset.clock = '';
        return item;
      }));
      dock.hidden = dockItems.length === 0;
      const pages = islandPages();
      const next = placement.value === 'island' ? widget : pages.includes(selected) ? selected : pages[0];
      showPage(next, false, false);
    });

    monitor.querySelector('.media input[type="file"]').addEventListener('change', event => {
      const file = event.target.files[0];
      if (!file) return;
      if (audioUrl) URL.revokeObjectURL(audioUrl);
      audioUrl = URL.createObjectURL(file);
      sampleStartedAt = null;
      samplePlayer.hidden = true;
      audio.src = audioUrl;
      track.textContent = file.name;
      monitor.querySelector('.media-meta').textContent = 'Yerel ses dosyası';
      audio.hidden = false;
      update();
    });
    for (const event of ['play', 'pause', 'ended']) audio.addEventListener(event, update);
    audio.addEventListener('error', () => {
      track.textContent = 'Bu ses dosyası oynatılamadı.';
      update();
    });
    setOpen(expanded);
    showPage(initialPage);
    screens.append(monitor);
    return update;
  }

  const monitors = [createMonitor(1, 'Clock', true), createMonitor(2, 'Media', false)];
  setInterval(() => monitors.forEach(update => update()), 250);
</script>
</html>
